# Daily newspaper publish: English edition first, translations second.
#
# The English crew already uses most of the 6h GitHub-hosted job budget.
# Translation stays in the product, but it runs as a follow-up job with its
# own clock so a slow Gemini pass can never cancel the paper or skip the
# grounded-page push.
#
# Schedule: 12:00 IST = 06:30 UTC
# Manual: Actions → Daily publish → Run workflow

name: Daily publish

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

concurrency:
  group: daily-publish
  cancel-in-progress: false

env:
  DATABASE_URL: postgresql://grounded:grounded@localhost:5432/grounded
  OUTPUT_DIR: ./output
  EMBEDDING_BACKEND: voyage
  GEMINI_MODEL: gemini-flash-lite-latest
  NEMOTRON_MODEL: nvidia/llama-3.3-nemotron-super-49b-v1.5
  GIT_AUTHOR_NAME: GROUNDED Bot
  GIT_AUTHOR_EMAIL: bot@grounded.india

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout backend
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Start Postgres
        run: |
          docker compose -f infra/docker-compose.yml up -d
          for i in $(seq 1 40); do
            if docker exec grounded-postgres pg_isready -U grounded -d grounded; then
              echo "Postgres ready"
              exit 0
            fi
            sleep 3
          done
          echo "Postgres failed to become ready"
          docker compose -f infra/docker-compose.yml logs
          exit 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install openai

      - name: Run publish pipeline
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # English only. --no-translate keeps this job on the pre-translation
        # critical path so the edition can still ship inside the 6h cap.
        run: python publish.py --no-site --no-translate

      - name: Checkout frontend repo
        uses: actions/checkout@v5
        with:
          repository: Grounded-india/grounded-page
          token: ${{ secrets.GROUNDPAGE_DEPLOY_TOKEN }}
          path: grounded-page
          ref: main

      - name: Push edition to frontend
        env:
          GROUNDPAGE_DEPLOY_TOKEN: ${{ secrets.GROUNDPAGE_DEPLOY_TOKEN }}
        run: python scripts/push_to_frontend.py --site grounded-page --source-dir output

      - name: Upload edition artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: edition-bundle
          path: |
            output/edition-*.md
            output/images/**/*
          if-no-files-found: ignore

  translate:
    needs: publish
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true

    steps:
      - name: Checkout backend
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install openai

      - name: Download English edition
        uses: actions/download-artifact@v6
        with:
          name: edition-bundle
          path: .

      - name: Translate edition
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          date_ist=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          src="output/edition-${date_ist}.md"
          if [ ! -f "$src" ]; then
            src=$(ls -1t output/edition-*.md | head -1)
          fi
          if [ -z "${src:-}" ] || [ ! -f "$src" ]; then
            echo "no edition markdown to translate"
            exit 1
          fi
          echo "translating $src"
          python -m grounded.agents translate --src "$src" --no-site

      - name: Checkout frontend repo
        uses: actions/checkout@v5
        with:
          repository: Grounded-india/grounded-page
          token: ${{ secrets.GROUNDPAGE_DEPLOY_TOKEN }}
          path: grounded-page
          ref: main

      - name: Push translations to frontend
        env:
          GROUNDPAGE_DEPLOY_TOKEN: ${{ secrets.GROUNDPAGE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          date_ist=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          src="output/edition-${date_ist}.md"
          if [ ! -f "$src" ]; then
            src=$(ls -1t output/edition-*.md | head -1)
          fi
          python scripts/push_to_frontend.py --site grounded-page --source-dir output --edition "$src"
