# Daily newspaper publish: English edition first, translations second.
#
# The English crew already uses most of the 6h GitHub-hosted job budget.
# Translation stays in the product, but it runs as a follow-up job with its
# own clock so a slow Gemini pass can never cancel the paper or skip the
# grounded-page push.
#
# Schedule: 12:00 IST = 06:30 UTC
# Manual: Actions → Daily publish → Run workflow
#   - leave "translate_only" unchecked for a full publish
#   - check "translate_only" and set "edition_date" to re-translate a shipped day

name: Daily publish

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      translate_only:
        description: "Skip English publish; only translate an already-shipped edition"
        type: boolean
        default: false
      edition_date:
        description: "Edition date YYYY-MM-DD (IST). Empty = today IST."
        type: string
        default: ""

concurrency:
  group: daily-publish
  cancel-in-progress: false

env:
  DATABASE_URL: postgresql://grounded:grounded@localhost:5432/grounded
  OUTPUT_DIR: ./output
  EMBEDDING_BACKEND: voyage
  GEMINI_MODEL: gemini-flash-lite-latest
  NEMOTRON_MODEL: nvidia/nemotron-3-super-120b-a12b
  GIT_AUTHOR_NAME: GROUNDED Bot
  GIT_AUTHOR_EMAIL: bot@grounded.india

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.translate_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout backend
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Start Postgres
        run: |
          docker compose -f infra/docker-compose.yml up -d
          for i in $(seq 1 40); do
            if docker exec grounded-postgres pg_isready -U grounded -d grounded; then
              echo "Postgres ready"
              exit 0
            fi
            sleep 3
          done
          echo "Postgres failed to become ready"
          docker compose -f infra/docker-compose.yml logs
          exit 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install openai

      - name: Run publish pipeline
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # English only. --no-translate keeps this job on the pre-translation
        # critical path so the edition can still ship inside the 6h cap.
        run: python publish.py --no-site --no-translate

      - name: Checkout frontend repo
        uses: actions/checkout@v5
        with:
          repository: Grounded-india/grounded-page
          token: ${{ secrets.GROUNDPAGE_DEPLOY_TOKEN }}
          path: grounded-page
          ref: main

      - name: Push edition to frontend
        env:
          GROUNDPAGE_DEPLOY_TOKEN: ${{ secrets.GROUNDPAGE_DEPLOY_TOKEN }}
        run: python scripts/push_to_frontend.py --site grounded-page --source-dir output

      - name: Upload edition artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: edition-bundle
          # Only ship today's IST edition + its images. Uploading every historical
          # output/edition-*.md bloated the artifact and invited wrong-date fallbacks.
          path: |
            output/edition-*.md
            output/images/**
          if-no-files-found: ignore

  translate:
    needs: publish
    # Run after a successful publish, OR on a translate-only manual dispatch
    # (needs.publish.result is 'skipped' when publish is gated off).
    if: |
      always() && (
        needs.publish.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.translate_only == true)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Fail the workflow when translation picks the wrong day or cannot push —
    # silent success with stale editions is worse than a red X.
    continue-on-error: false

    steps:
      - name: Checkout backend
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install openai

      - name: Resolve edition date
        id: edition
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.edition_date }}" ]; then
            date_ist="${{ inputs.edition_date }}"
          else
            date_ist=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          fi
          echo "date=$date_ist" >> "$GITHUB_OUTPUT"
          echo "Resolved edition date: $date_ist"

      - name: Download English edition artifact
        if: ${{ needs.publish.result == 'success' }}
        uses: actions/download-artifact@v6
        with:
          name: edition-bundle
          # upload-artifact strips the common `output/` prefix, so download INTO
          # output/ or the files land at the workspace root and we silently fall
          # back to stale checked-in markdown under output/.
          path: output

      - name: Load English edition from grounded-page
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.translate_only == true }}
        uses: actions/checkout@v5
        with:
          repository: Grounded-india/grounded-page
          token: ${{ secrets.GROUNDPAGE_DEPLOY_TOKEN }}
          path: grounded-page-src
          ref: main

      - name: Stage English edition for translate-only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.translate_only == true }}
        run: |
          set -euo pipefail
          date_ist="${{ steps.edition.outputs.date }}"
          mkdir -p output/images
          src="grounded-page-src/content/editions/edition-${date_ist}.md"
          if [ ! -f "$src" ]; then
            echo "grounded-page has no English edition at $src"
            exit 1
          fi
          cp "$src" "output/edition-${date_ist}.md"
          if [ -d "grounded-page-src/public/images/${date_ist}" ]; then
            rm -rf "output/images/${date_ist}"
            cp -R "grounded-page-src/public/images/${date_ist}" "output/images/${date_ist}"
          fi
          echo "staged $src for translation"

      - name: Translate edition
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          date_ist="${{ steps.edition.outputs.date }}"
          src="output/edition-${date_ist}.md"
          if [ ! -f "$src" ]; then
            echo "missing $src after staging/download; refusing to translate a stale edition"
            echo "output/ contains:"
            ls -la output/ || true
            exit 1
          fi
          # Guard against accidentally translating a different day's file.
          case "$(basename "$src")" in
            "edition-${date_ist}.md") ;;
            *)
              echo "refusing to translate $src for requested date $date_ist"
              exit 1
              ;;
          esac
          echo "translating $src"
          python -m grounded.agents translate --src "$src" --no-site

      - name: Checkout frontend repo
        uses: actions/checkout@v5
        with:
          repository: Grounded-india/grounded-page
          token: ${{ secrets.GROUNDPAGE_DEPLOY_TOKEN }}
          path: grounded-page
          ref: main

      - name: Push translations to frontend
        env:
          GROUNDPAGE_DEPLOY_TOKEN: ${{ secrets.GROUNDPAGE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          date_ist="${{ steps.edition.outputs.date }}"
          src="output/edition-${date_ist}.md"
          python scripts/push_to_frontend.py \
            --site grounded-page \
            --source-dir output \
            --date "$date_ist" \
            --edition "$src"
